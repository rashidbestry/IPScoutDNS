# IPScoutDNS configuration

[direct_dns]
# These resolvers are reached through the DIRECT connection.
# Direct DNS resolvers are always tried first.
8.8.8.8
1.1.1.1

[proxy_dns]
# These resolvers are reached through the SOCKS5 tunnel below.
# Supports DNS-over-TCP (host, host:port), DNS-over-HTTPS (https://...) and all kind of DNS resolvers.
9.9.9.9
208.67.222.222
https://dns.adguard-dns.com/dns-query
94.140.14.14:53
185.228.168.9

[dns_resolve_proxy]
# SOCKS5 proxy for DNS resolvers (proxy_dns).
address=127.0.0.1:1080

[tls_proxy]
# SOCKS5 proxy for TLS reachability checks (used when tls_route=proxy).
address=127.0.0.1:1080

[cache]
# Selected IP cache lifetime.
ttl=24h

[fallback]
# DNS fallback used when no usable IP is selected.
address=8.8.8.8:53

[server]
# IPScoutDNS listener.
address=127.0.0.1:53
# File to output reachable IPs in hosts format.
reachable_hosts=reachable.hosts
# File to output unreachable IPs in hosts format.
unreachable_hosts=unreachable.hosts
# File containing domains (regexes) to resolve.
domains_file=domains.txt
# Upstream DNS request timeout.
dns_timeout=3s
# TLS reachability check timeout per candidate IP.
tls_timeout=3s
# TLS port for the reachability check.
tls_port=443
# Route for the TLS check (direct or proxy).
tls_route=direct
# Dedicated SOCKS5 proxy port for TLS reachability checks (when tls_route=proxy).
# Overrides port for tls_proxy if set.
# tls_proxy_port=1080
# Maximum concurrent TLS checks for candidate IPs.
parallel_tests=16
# TTL placed on DNS answers, in seconds.
answer_ttl=300
# Graceful shutdown timeout.
shutdown_timeout=5s
