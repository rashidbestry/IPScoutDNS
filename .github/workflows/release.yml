name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Package (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            binary: ipscoutdns
            extension: tar.gz
          - goos: linux
            goarch: arm64
            binary: ipscoutdns
            extension: tar.gz
          - goos: windows
            goarch: amd64
            binary: ipscoutdns.exe
            extension: zip
          - goos: windows
            goarch: arm64
            binary: ipscoutdns.exe
            extension: zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build binary
        run: |
          mkdir -p dist
          go build -trimpath -o "dist/${{ matrix.binary }}" .
          cp ipscoutdns.conf domains.txt dist/
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      - name: Create archive
        run: |
          archive="ipscoutdns-${GITHUB_REF_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.extension }}"
          if [ "${{ matrix.extension }}" = "zip" ]; then
            (cd dist && zip -q "../$archive" *)
          else
            tar -C dist -czf "$archive" .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ipscoutdns-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ipscoutdns-*.${{ matrix.extension }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build, openwrt-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ipscoutdns-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*

  openwrt-package:
    uses: ./.github/workflows/openwrt-package.yml
    with:
      version: ${{ github.ref_name }}
    permissions:
      contents: read
