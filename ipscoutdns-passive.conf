# Scheduled resolution; no DNS listener or fallback forwarding.
mode=passive
passive_domains_file=passive-domains.txt
resolve_interval=24h
resolve_parallel=16

direct_dns={1.1.1.1,8.8.8.8}
direct_dns_interface=default
dns_timeout=3s
tcp_route=direct
direct_tcp_interface=default
tcp_port=443
tcp_timeout=3s
parallel_tests=16
logs_enabled=true

reachable_hosts=reachable.hosts
reachable_domains_file=reachable.domains
reachable_ips_file=reachable.ips
unreachable_domains_file=unreachable.domains
unreachable_ips_file=unreachable.ips
