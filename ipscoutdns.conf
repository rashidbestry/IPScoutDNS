# IPScoutDNS configuration

# Required: active (DNS server) or passive (scheduled domain resolution).
mode=active

----------------------------------------- S E R V E R -------------------------------------

# IPScoutDNS listener.
server=127.0.0.1:53

# Enable or disable application logs.
logs_enabled=true

# Selected IP cache lifetime.
ttl=24h


-------------------------------------------- D N S ----------------------------------------


# These resolvers are reached through the DIRECT connection.
direct_dns={
    8.8.8.8,
    1.1.1.1
}

# Interface name or local source IP for direct DNS.
direct_dns_interface=default


-------------------------------------------- D N S ----------------------------------------


# These resolvers are reached through the SOCKS5 tunnel below. ( IP, DOH, DOT, .. )
proxy_dns={
    9.9.9.9,
    208.67.222.222,
    https://dns.adguard-dns.com/dns-query,
    94.140.14.14:53,
    185.228.168.9,
}

# SOCKS5 proxy for DNS resolvers (proxy_dns).
proxy_dns_address=127.0.0.1:1080


-------------------------------------------- D N S ----------------------------------------


# DNS fallback and not an A records redirected to fallback IP.
fallback_dns=8.8.8.8:53

# Interface name or local source IP for fallback DNS.
fallback_dns_interface=default


-------------------------------------------- D N S ----------------------------------------


# Upstream DNS request timeout.
dns_timeout=3s

# TTL placed on DNS answers, in seconds.
answer_ttl=300


-------------------------------------- P R O B E  C H E C K -------------------------------


# TCP/TLS port for the reachability check.
tcp_port=443

# Route for the reachability check (direct or proxy).
tcp_route=proxy

# SOCKS5 proxy for reachability checks (used when tcp_route=proxy).
tcp_proxy=127.0.0.1:1080

# Interface name or local source IP for direct reachability checks.
direct_tcp_interface=default

# Maximum concurrent reachability checks for candidate IPs.
parallel_tests=16

# Reachability check timeout per candidate IP.
tcp_timeout=3s


------------------------------- I N P U T / O U T P U T   F I L E S -----------------------

# Regex allowlist used in active mode.
active_domains_file=active-domains.txt

# Literal domain list used in passive mode (no regexes).
passive_domains_file=passive-domains.txt

# Delay after a passive pass completes; first pass starts immediately.
resolve_interval=24h

# Concurrent domain jobs in passive mode; parallel_tests applies per domain.
resolve_parallel=16

# File to output reachable IPs in hosts format.
reachable_hosts=reachable.hosts

# Optional file to output reachable domains only.
reachable_domains_file=reachable.domains

# Optional file to output reachable IPs only.
reachable_ips_file=reachable.ips

# File to output unreachable domains only.
unreachable_domains_file=unreachable.domains

# File to output unreachable IPs only.
unreachable_ips_file=unreachable.ips
