# IPScoutDNS configuration

[direct_dns]
# These resolvers are reached through the DIRECT connection. Always tried first.
8.8.8.8
1.1.1.1

[proxy_dns]
# These resolvers are reached through the SOCKS5 tunnel below. ( IP, DOH, DOT, .. )
9.9.9.9
208.67.222.222
https://dns.adguard-dns.com/dns-query
94.140.14.14:53
185.228.168.9

[fallback_dns]
# DNS fallback and not A records redirected to fallback IP.
10.44.2.1:53

[dns_resolve_proxy]
# SOCKS5 proxy for DNS resolvers (proxy_dns).
address=127.0.0.1:1080

[tls_proxy]
# SOCKS5 proxy for reachability checks (used when tls_route=proxy).
address=127.0.0.1:1080

[server]
# IPScoutDNS listener.
address=127.0.0.1:53
# Enable or disable application logs.
logs_enabled=true
# Optional interface name or local source IP for direct DNS and fallback traffic.
# This does not affect DNS requests sent through the SOCKS5 proxy.
dns_interface=
# Selected IP cache lifetime.
ttl=24h
# File to output reachable IPs in hosts format.
reachable_hosts=reachable.hosts
# Optional file to output reachable domains only.
reachable_domains_file=reachable.domains
# Optional file to output reachable IPs only.
reachable_ips_file=reachable.ips
# File to output unreachable domains only.
unreachable_domains_file=unreachable.domains
# File to output unreachable IPs only.
unreachable_ips_file=unreachable.ips
# File containing domains (regexes) to resolve.
domains_file=domains.txt
# Upstream DNS request timeout.
dns_timeout=3s
# TCP reachability check timeout per candidate IP.
tls_timeout=3s
# TCP port for the reachability check.
tls_port=443
# Route for the reachability check (direct, proxy, or interface).
tls_route=direct
# Required when tls_route=interface; accepts an interface name or local source IP.
tls_interface=
# Maximum concurrent reachability checks for candidate IPs.
parallel_tests=16
# TTL placed on DNS answers, in seconds.
answer_ttl=300
# Graceful shutdown timeout.
shutdown_timeout=5s
