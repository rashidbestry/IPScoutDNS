# IPScoutDNS configuration

----------------------------------------- S E R V E R -------------------------------------

# Required: active (DNS server) or passive (scheduled domain resolution).
mode=active

# IPScoutDNS listener.
server=127.0.0.1:53

# Enable or disable runtime console logs; startup/config logs always appear.
logs_enabled=true

# Save startup and runtime logs to a dated text file (independent of console logs).
# Windows stores these files in the logs folder beside the executable.
save_logs=true

# Rotate before the next message would exceed this size; whole messages stay intact.
log_max_size=10MB

# Keep the newest logs, including the current file. Linux/OpenWrt also retains
# uncopied files until a successful scheduled copy. Inactive when save_logs=false.
log_keep_files=7

# Linux/OpenWrt active mode: copy the saved log to /etc/ipscoutdns/logs/.
# This schedule is separate from active_copy_interval; ignored on Windows.
active_log_copy_interval=1h

# Selected IP cache lifetime.
ttl=24h

# Optional daily local start time (HH:MM, e.g. 03:00). Blank starts immediately.
passive_resolve_time=

# Delay after each pass when passive_resolve_time is blank.
passive_resolve_interval=24h

# Concurrent domain jobs in passive mode; parallel_tests applies per domain.
passive_resolve_parallel=16

# Linux/OpenWrt active mode: copy runtime output files to /etc/ipscoutdns/.
# Wait this long after startup and between copies (e.g. 1h or 6h).
# Ignored on Windows, where outputs stay beside the executable without copying.
active_copy_interval=24h


-------------------------------------------- D N S ----------------------------------------


# These resolvers are reached through the DIRECT connection.
direct_dns={
    8.8.8.8,
    1.1.1.1
}

# Interface name or local source IP for direct DNS.
direct_dns_interface=default


-------------------------------------------- D N S ----------------------------------------


# These resolvers are reached through the SOCKS5 tunnel below. ( IP, DOH, DOT, .. )
proxy_dns={
    9.9.9.9,
    208.67.222.222,
    https://dns.adguard-dns.com/dns-query,
    94.140.14.14:53,
    185.228.168.9,
}

# SOCKS5 proxy for DNS resolvers (proxy_dns).
proxy_dns_address=127.0.0.1:1080


-------------------------------------------- D N S ----------------------------------------


# DNS fallback and not an A records redirected to fallback IP.
fallback_dns=8.8.8.8:53

# Interface name or local source IP for fallback DNS.
fallback_dns_interface=default


-------------------------------------------- D N S ----------------------------------------


# Upstream DNS request timeout.
dns_timeout=3s

# TTL placed on DNS answers, in seconds.
answer_ttl=300


-------------------------------------- P R O B E  C H E C K -------------------------------


# TCP/TLS port for the reachability check.
tcp_port=443

# Route for the reachability check (direct or proxy).
tcp_route=proxy

# SOCKS5 proxy for reachability checks (used when tcp_route=proxy).
tcp_proxy=127.0.0.1:1080

# Interface name or local source IP for direct reachability checks.
direct_tcp_interface=default

# Maximum concurrent reachability checks for candidate IPs.
parallel_tests=16

# Maximum successful IPs per domain in Active and Passive mode (0 = unlimited).
# Stop further probes for this domain once the limit is reached.
hosts_max_ips_per_domain=8

# Reachability check timeout per candidate IP.
tcp_timeout=3s

# Enable or disable each probe. TLS/HTTP still use TCP when tcp_probe=false.
tcp_probe = true
tls_probe = true
http_probe = true
icmp_probe = true


------------------------------- I N P U T / O U T P U T   F I L E S -----------------------

# Relative domain-list paths are resolved beside this config file.
# Regex allowlist used in active mode.
active_domains_file=active-domains.txt

# Literal domain list used in passive mode (no regexes).
passive_domains_file=passive-domains.txt

# Output directory is selected automatically in both modes:
# OpenWrt: /tmp/ipscoutdns/; other Linux: /temp/ipscoutdns/;
# Windows: beside the executable. These settings choose filenames only.
# Blank optional output filenames disable those files.

# File to output reachable IPs in hosts format.
reachable_hosts=reachable.hosts

# Optional file to output reachable domains only.
reachable_domains_file=reachable.domains

# Optional file to output reachable IPs only.
reachable_ips_file=reachable.ips

# File to output unreachable domains only.
unreachable_domains_file=unreachable.domains

# File to output unreachable IPs only.
unreachable_ips_file=unreachable.ips
